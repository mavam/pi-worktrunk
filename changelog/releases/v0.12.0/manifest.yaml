created: 2026-09-30
title: Progress spinner for /wt commands
intro: >-
  This release shows a spinner above the editor while `/wt` commands run and while
  Pi moves your session, so slow aliases like `land` no longer leave the screen blank.
  The spinner steps aside for approval dialogs and worktree pickers.
